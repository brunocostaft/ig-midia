name: Post Instagram

# Confere a cada 10 minutos se algum post de jobs/*/agenda.json chegou na hora.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "pasta em jobs/ (vazio = publicar o que estiver na hora)"
        default: ""
      modo:
        description: "validate = testa sem publicar | publish = posta agora"
        default: validate
        type: choice
        options: [validate, publish]

permissions:
  contents: write
  actions: write

concurrency:
  group: post-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg (reels)
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Publicar
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -n "$JOB" ]; then
            python3 scripts/postar_agendados.py --${{ github.event.inputs.modo }} "$JOB" | tee saida.txt
          else
            python3 scripts/postar_agendados.py | tee saida.txt
          fi
          grep '^PUBLICADO:' saida.txt | sed 's/^/### /' >> $GITHUB_STEP_SUMMARY || true

      - name: Salvar marcadores e atualizar calendário
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add jobs/*/PUBLICADO 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publicado" && git pull --rebase -q && git push
            GH_TOKEN=${{ github.token }} gh workflow run painel.yml -R ${{ github.repository }} || true
          fi
