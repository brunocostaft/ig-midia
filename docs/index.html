<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Posts">
<title>Calendário de posts · @brunocostaft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23060d1c'/><circle cx='32' cy='32' r='20' fill='none' stroke='%237fa8e8' stroke-width='5'/><circle cx='32' cy='32' r='8' fill='%237fa8e8'/><circle cx='48' cy='16' r='5' fill='%23ff5a3c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,600&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--noite:#060d1c;--fundo2:#0a1428;--marca:#0b3974;--gelo:#7fa8e8;--branco:#eef3fb;--brasa:#ff5a3c;--linha:#ffffff14;--suave:#ffffff8c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
html{background:var(--noite);color:var(--branco);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(ellipse 80% 40% at 70% -5%,#0b397488,transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gelo);outline-offset:3px;border-radius:6px}
.app{max-width:1280px;margin:0 auto;padding:28px clamp(16px,4vw,48px) 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.mes{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:clamp(56px,9vw,112px);line-height:.9;letter-spacing:-.04em}
.mes small{font-family:Poppins;font-style:normal;font-weight:500;font-size:20px;letter-spacing:0;color:var(--suave);margin-left:14px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{height:44px;min-width:44px;padding:0 16px;border:1px solid var(--linha);border-radius:22px;font-weight:500;font-size:15px}
.nav button:hover{border-color:#ffffff40}
.resumo{display:flex;gap:28px;margin:22px 0 26px;flex-wrap:wrap;font-size:15px;color:var(--suave)}
.resumo b{color:var(--branco);font-weight:600;font-size:22px;margin-right:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.dot.agendado{border:2px solid var(--gelo)} .dot.publicado{background:var(--gelo)} .dot.atrasado{background:var(--brasa);box-shadow:0 0 10px var(--brasa)}
/* régua do mês: ponteiro em "hoje", como o anel de zoom */
.regua{position:relative;height:30px;margin-bottom:8px}
.regua i{position:absolute;bottom:0;width:1px;background:#ffffff30}
.regua .hoje{position:absolute;bottom:0;width:3px;height:30px;background:var(--brasa);border-radius:2px;box-shadow:0 0 12px var(--brasa)}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--linha);border-left:1px solid var(--linha)}
.sem{padding:10px 12px;font-size:13px;font-weight:500;color:var(--suave);border-right:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.dia{min-height:150px;padding:10px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;position:relative}
.dia.fora{opacity:.28}
.dia .num{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:26px;line-height:1;color:#ffffffb0}
.dia.hoje{background:linear-gradient(#0b397455,transparent)}
.dia.hoje .num{color:var(--brasa);font-weight:600}
.post{display:flex;gap:8px;align-items:center;text-align:left;width:100%;padding:6px;border-radius:10px;background:#ffffff08;border:1px solid transparent}
.post:hover{border-color:#ffffff30;background:#ffffff10}
.post img,.post .sem-img{width:44px;height:55px;object-fit:cover;border-radius:6px;flex:none;background:var(--fundo2)}
.post .info{flex:1;min-width:0;font-size:12px;line-height:1.3}
.post .hora{font-weight:600;font-size:13px}
.post .tit{color:var(--suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post.agendado{border:1px dashed #7fa8e866}
.post.atrasado{border:1px solid var(--brasa)}
.lista{display:none}
.aviso{margin-top:22px;font-size:13px;color:var(--suave);line-height:1.6}
/* painel do post */
.veu{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--fundo2);border-left:1px solid var(--linha);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:24px 28px 40px}
.aberto .veu{opacity:1;pointer-events:auto} .aberto .gaveta{transform:none}
.gaveta .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.fechar{width:44px;height:44px;border-radius:22px;border:1px solid var(--linha);font-size:22px}
.status{font-size:14px;font-weight:600}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.slides img,.slides video{flex:none;width:86%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:#000}
.gaveta h2{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em;margin:20px 0 6px}
.quando{color:var(--suave);font-size:15px}
.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:20px 0}
.met{border:1px solid var(--linha);border-radius:12px;padding:12px}
.met b{display:block;font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:32px;color:var(--gelo)}
.met span{font-size:13px;color:var(--suave)}
.legenda{white-space:pre-wrap;font-size:15px;line-height:1.6;color:#ffffffcc;border-top:1px solid var(--linha);padding-top:18px}
.abrir{display:inline-flex;margin-top:18px;padding:12px 20px;border-radius:24px;background:var(--gelo);color:var(--noite);font-weight:600;text-decoration:none}
@media (max-width:760px){
  .grade,.regua{display:none} .lista{display:flex;flex-direction:column;gap:10px}
  .lista h3{font-size:14px;color:var(--suave);font-weight:500;margin:14px 0 2px}
  .post img,.post .sem-img{width:64px;height:80px} .post .info{font-size:14px} .post{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 class="mes" id="mes">…</h1>
    <div class="nav">
      <button id="ant" aria-label="Mês anterior">←</button>
      <button id="hojeBtn">Hoje</button>
      <button id="prox" aria-label="Próximo mês">→</button>
    </div>
  </header>
  <div class="resumo" id="resumo"></div>
  <div class="regua" id="regua" aria-hidden="true"></div>
  <div class="grade" id="grade" role="grid"></div>
  <div class="lista" id="lista"></div>
  <p class="aviso" id="aviso"></p>
</div>
<div class="veu" id="veu"></div>
<aside class="gaveta" id="gaveta" aria-label="Detalhes do post" aria-hidden="true"></aside>

<script>
const TZ = "America/Sao_Paulo";
const SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const ROTULO = {agendado:"Agendado", publicado:"Publicado", atrasado:"Atrasado: não saiu no horário"};
let POSTS = [], ref = hojeSP();

function partesSP(d){ // ano, mês (0-11), dia, hora no fuso de Brasília
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(d).map(x=>[x.type,x.value]));
  return {a:+p.year, m:+p.month-1, d:+p.day, hm:`${p.hour}:${p.minute}`};
}
function hojeSP(){ const p = partesSP(new Date()); return {a:p.a, m:p.m}; }
const chave = (a,m,d)=>`${a}-${m}-${d}`;
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cartao(p){
  const h = partesSP(new Date(p.quando)).hm, capa = p.midias && p.midias[0];
  return `<button class="post ${p.status}" data-id="${esc(p.id)}">
    ${capa ? `<img src="${esc(capa)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="sem-img"></span>`}
    <span class="info"><span class="hora"><span class="dot ${p.status}"></span>${h} · ${p.tipo}</span><br><span class="tit">${esc(p.titulo)}</span></span></button>`;
}

function render(){
  const {a,m} = ref, nomeMes = new Date(a,m,1).toLocaleDateString("pt-BR",{month:"long"});
  document.getElementById("mes").innerHTML = `${nomeMes}<small>${a}</small>`;
  const porDia = {};
  for (const p of POSTS){ const q = partesSP(new Date(p.quando)); (porDia[chave(q.a,q.m,q.d)] ||= []).push(p); }
  Object.values(porDia).forEach(l=>l.sort((x,y)=>new Date(x.quando)-new Date(y.quando)));

  // grade do mês
  const ini = new Date(a,m,1).getDay(), dias = new Date(a,m+1,0).getDate(), hoje = partesSP(new Date());
  let html = SEM.map(s=>`<div class="sem">${s}</div>`).join("");
  const total = Math.ceil((ini+dias)/7)*7;
  for (let i=0;i<total;i++){
    const dt = new Date(a,m,1-ini+i), da=dt.getFullYear(), dm=dt.getMonth(), dd=dt.getDate();
    const ehHoje = da===hoje.a && dm===hoje.m && dd===hoje.d;
    const lista = porDia[chave(da,dm,dd)] || [];
    html += `<div class="dia ${dm!==m?"fora":""} ${ehHoje?"hoje":""}" role="gridcell" aria-label="${dd}">
      <span class="num">${dd}</span>${lista.map(cartao).join("")}</div>`;
  }
  document.getElementById("grade").innerHTML = html;

  // régua: ponteiro no dia de hoje
  const rg = document.getElementById("regua");
  let r = ""; for (let d=1; d<=dias; d++) r += `<i style="left:${(d-1)/(dias-1)*100}%;height:${d%5?10:18}px"></i>`;
  if (hoje.a===a && hoje.m===m) r += `<span class="hoje" style="left:calc(${(hoje.d-1)/(dias-1)*100}% - 1px)"></span>`;
  rg.innerHTML = r;

  // lista (celular) e resumo do mês
  const doMes = POSTS.filter(p=>{const q=partesSP(new Date(p.quando)); return q.a===a&&q.m===m;}).sort((x,y)=>new Date(x.quando)-new Date(y.quando));
  let li = "", ultimo = "";
  for (const p of doMes){
    const dia = new Date(p.quando).toLocaleDateString("pt-BR",{timeZone:TZ,weekday:"long",day:"numeric"});
    if (dia!==ultimo){ li += `<h3>${dia}</h3>`; ultimo = dia; }
    li += cartao(p);
  }
  document.getElementById("lista").innerHTML = li || `<p class="aviso">Nenhum post neste mês.</p>`;
  const n = s => doMes.filter(p=>p.status===s).length;
  document.getElementById("resumo").innerHTML =
    `<span><span class="dot publicado"></span><b>${n("publicado")}</b>publicados</span>
     <span><span class="dot agendado"></span><b>${n("agendado")}</b>agendados</span>` +
    (n("atrasado") ? `<span><span class="dot atrasado"></span><b>${n("atrasado")}</b>atrasados</span>` : "");
}

function abrir(id){
  const p = POSTS.find(x=>x.id===id); if (!p) return;
  const quando = new Date(p.quando).toLocaleString("pt-BR",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  const M = p.metricas || {}, nomes = {views:"views",alcance:"alcance",curtidas:"curtidas",comentarios:"comentários",salvamentos:"salvamentos",compartilhamentos:"compartilh."};
  const mets = Object.entries(nomes).filter(([k])=>M[k]!=null).map(([k,v])=>`<div class="met"><b>${M[k].toLocaleString("pt-BR")}</b><span>${v}</span></div>`).join("");
  const midias = (p.midias||[]).map(u=>/\.mp4(\?|$)/.test(u)?`<video src="${esc(u)}" controls playsinline></video>`:`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join("");
  const g = document.getElementById("gaveta");
  g.innerHTML = `<div class="topo"><span class="status"><span class="dot ${p.status}"></span>${ROTULO[p.status]}</span>
      <button class="fechar" id="fechar" aria-label="Fechar">×</button></div>
    ${midias?`<div class="slides">${midias}</div>`:""}
    <h2>${esc(p.titulo)}</h2><div class="quando">${quando} · ${p.tipo}${p.midias&&p.midias.length>1?` · ${p.midias.length} slides`:""}</div>
    ${mets?`<div class="mets">${mets}</div>`:""}
    ${p.legenda?`<div class="legenda">${esc(p.legenda)}</div>`:""}
    ${p.link?`<a class="abrir" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir no Instagram</a>`:""}`;
  document.body.classList.add("aberto"); g.setAttribute("aria-hidden","false");
  document.getElementById("fechar").focus();
}
function fechar(){ document.body.classList.remove("aberto"); document.getElementById("gaveta").setAttribute("aria-hidden","true"); }

document.addEventListener("click", e=>{
  const b = e.target.closest(".post"); if (b) return abrir(b.dataset.id);
  if (e.target.id==="fechar" || e.target.id==="veu") fechar();
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape") fechar(); });
document.getElementById("ant").onclick = ()=>{ ref = ref.m ? {a:ref.a,m:ref.m-1} : {a:ref.a-1,m:11}; render(); };
document.getElementById("prox").onclick = ()=>{ ref = ref.m<11 ? {a:ref.a,m:ref.m+1} : {a:ref.a+1,m:0}; render(); };
document.getElementById("hojeBtn").onclick = ()=>{ ref = hojeSP(); render(); };

fetch("dados.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  POSTS = d.posts || [];
  const em = new Date(d.gerado_em).toLocaleString("pt-BR",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  document.getElementById("aviso").textContent = `Atualizado ${em}. Atualiza sozinho a cada hora.` + (d.aviso ? " " + d.aviso : "");
  render();
}).catch(()=>{ document.getElementById("aviso").textContent = "Não consegui carregar os posts. Recarregue a página."; render(); });
</script>
</body>
</html>
